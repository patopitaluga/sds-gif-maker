<!DOCTYPE html>
<html lang="es-es">
<head>
  <meta charset="utf-8" />
  <title>SDS Gif Maker</title>
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, viewport-fit=cover">
  <link rel="stylesheet" href="style.css">
  <style>
    /* tiny styles to keep things readable */
    #sketch-container { position: relative; display: inline-block; }
    .overlay-controls { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.5); padding: 5px; border-radius: 4px; }
    #thumbnails canvas { cursor: pointer; border: 1px solid #333; }
    .controls { margin-top: 8px; }
  </style>
</head>
<body>
<div id="app-container">

  <div class="title">SDS Gif Maker</div>

  <div id="sketch-container">
    <div class="overlay-controls">
      <button id="takeScreenshot" @click="handleTakeScreenshot">📸 Take Screenshot</button>
    </div>
  </div>

  <div class="controls">
    <button @click="createGifFromScreenshots()" v-if="screenshots.length > 0">🎞️ Download</button>
    <button @click="createGifFromScreenshots(true)" v-if="screenshots.length > 0 && browserCanShare">Share</button>
    <label style="margin-left:10px;">
      Frame Delay (ms):
      <input id="frameDelay" type="number" value="200" min="50" step="10" style="width:60px;">
    </label>
  </div>


  <ul id="thumbnailsContainer" style="margin-top: 10px; display: flex; flex-wrap: wrap; gap: 5px;">

    <li v-for="(eachScreenshot, index) in screenshots" class="thumbnail" :key="index">
      <img :src="eachScreenshot.toDataURL()" />
      <button
        @click="handleRemoveScreenshot(index)"
        class="delete-btn"
        type="button"
      >🗑️</button>
    </li>
  </ul>

</div>

<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
<script src="gif.js"></script>
<script>
const { createApp, ref } = Vue;

let video;
let gif;
const WIDTH = 320;
let HEIGHT = 0; // will take ratio of webcam
let mainCanvasElt = null;
const thumbW = 160, thumbH = 120;
const workerScriptPath = new URL('gif.worker.js', window.location.href).toString();

function getCurrentDateTime() {
  const now = new Date();

  const year = now.getFullYear();
  const month = String(now.getMonth() + 1).padStart(2, '0');
  const day = String(now.getDate()).padStart(2, '0');
  const hours = String(now.getHours()).padStart(2, '0');
  const minutes = String(now.getMinutes()).padStart(2, '0');
  const seconds = String(now.getSeconds()).padStart(2, '0');

  return `${year}-${month}-${day}-${hours}-${minutes}-${seconds}`;
}

createApp({
  setup() {
    const screenshots = ref([]);
    const browserCanShare = ref(Boolean(navigator.share));

    function createGifFromScreenshots(share = false) {
      if (screenshots.value.length === 0) {
        alert('No screenshots to make a GIF!');
        return;
      }

      const delay = parseInt(document.getElementById('frameDelay').value, 10) || 200;

      gif = new GIF({
        workers: 2,
        quality: 10,
        width: WIDTH,
        height: HEIGHT,
        workerScript: workerScriptPath
      });

      screenshots.value.forEach(canvasFrame => {
        gif.addFrame(canvasFrame, { copy: true, delay: delay });
      });

      gif.on('finished', function(blob) {
        if (share) {
          const fileToShare = new File([blob], `sds-gif-${getCurrentDateTime()}`, {
            type: 'image/gif',
            lastModified: Date.now()
          });

          browserCanShare.value = navigator.canShare && navigator.canShare({ files: [fileToShare] });
          const shareGif = () => {
            navigator.share({
              title: '',
              text: '',
              files: [fileToShare]
            }).catch(err => console.error(err));
          }

          const a = document.createElement('a');
          a.onclick = shareGif;
          a.click();
        } else {
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `sds-gifmaker-${Date.now()}.gif`;
          a.click();
        }
      });

      gif.on('progress', p => {
        console.log('GIF render progress', Math.round(p * 100) + '%');
      });

      gif.render();
    }

    const handleTakeScreenshot = () => {
      const currentStateOfCanvas = document.createElement('canvas');
      currentStateOfCanvas.width = WIDTH;
      currentStateOfCanvas.height = HEIGHT;
      const fctx = currentStateOfCanvas.getContext('2d');
      fctx.drawImage(mainCanvasElt, 0, 0, WIDTH, HEIGHT);

      screenshots.value = [...screenshots.value, currentStateOfCanvas];
    };

    const handleRemoveScreenshot = (index) => {
      screenshots.value = screenshots.value.splice(index, 1);
    };

    return {
      screenshots,
      createGifFromScreenshots,
      handleTakeScreenshot,
      handleRemoveScreenshot,
    }
  }
}).mount('#app-container')

// p5
function setup() {
  console.log('p5 setup running');
  const tempCanvasToDetermineRatio = createCanvas(WIDTH, HEIGHT);
  tempCanvasToDetermineRatio.style.opacity = 0;
  tempCanvasToDetermineRatio.style.width = 0;
  tempCanvasToDetermineRatio.style.height = 0;  
  tempCanvasToDetermineRatio.parent('sketch-container');
  pixelDensity(1);

  video = createCapture(VIDEO, () => {
    console.log('camera started');
  });
  video.size(WIDTH * 2, WIDTH * 2); // capture larger, but we draw it scaled to WIDTHxHEIGHT
  video.hide();

  video.elt.onloadedmetadata = () => {
    const aspectRatio = video.elt.videoHeight / video.elt.videoWidth;
    HEIGHT = WIDTH * aspectRatio;

    tempCanvasToDetermineRatio.remove();

    const canvas = createCanvas(WIDTH, HEIGHT);
    pixelDensity(1);
    mainCanvasElt = canvas.elt;
  };
}
function draw() {
  background(0);
  if (video) {
    image(video, 0, 0, WIDTH, HEIGHT);
  }
}
</script>
</body>
</html>
