
<!DOCTYPE html>
<html lang="es-es">
<head>
  <meta charset="utf-8" />
  <title>SDS Gif Maker</title>
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, viewport-fit=cover">
  <link rel="icon" href="/sds-gif-maker/favicon.png" type="image/png">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<audio id="cameraSound" preload="auto">
  <source src="camera2.mp3" type="audio/mpeg">
</audio>
<div id="app-container">
  <div class="title" style="text-align: center;">SDS Gif Maker</div>

  <div style="display: flex; width: 100%; justify-content: center; align-items: center;overflow: hidden" :style="{ height: displayingPreview ? '0' : 'auto' }">
    <div id="sketch-container">
      <div class="overlay-controls">
        <button
          @click="handleTakeScreenshot"
          type="button"
          class="whole-cam-button"
        >
          <span>
            📸 Take Screenshot
          </span>
        </button>
        <button
          @click="handleTakeBurst"
          type="button"
          :disabled="isCapturingBurst"
          class="burst-button"
        >
          {{ isCapturingBurst ? `📷 ${burstCountdown > 0 ? burstCountdown : 'Capturing...'}` : '📷 Take Burst' }}
        </button>
      </div>
    </div>
  </div>
  <img v-if="displayingPreview" :src="previewImage" style="display: block; margin-left: auto;margin-right: auto;"/>

  <div class="controls">
    <button @click="createGifFromScreenshots('preview')" v-if="!displayingPreview && screenshots.length > 0">🖼️ Show Preview</button>
    <button v-if="displayingPreview" @click="displayingPreview = false">🎥 Show Live Cam</button>
    <button @click="createGifFromScreenshots('download')" v-if="screenshots.length > 0">🎞️ Download</button>

    <button @click="shareGif" v-if="displayingPreview && screenshots.length > 0 && browserCanShare">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512" style="width: 16px; height: 16px; display: inline-block; vertical-align: middle;">
        <path
          d="M352 224c53 0 96-43 96-96s-43-96-96-96s-96 43-96 96c0 4 .2 8 .7 11.9l-94.1 47C145.4 170.2 121.9 160 96 160c-53 0-96 43-96 96s43 96 96 96c25.9 0 49.4-10.2 66.6-26.9l94.1 47c-.5 3.9-.7 7.8-.7 11.9c0 53 43 96 96 96s96-43 96-96s-43-96-96-96c-25.9 0-49.4 10.2-66.6 26.9l-94.1-47c.5-3.9 .7-7.8 .7-11.9s-.2-8-.7-11.9l94.1-47C302.6 213.8 326.1 224 352 224z"
        />
      </svg>
      Share
    </button>

    <label style="margin-left:10px;">
      Frame Delay (ms):
      <input id="frameDelay" type="number" value="200" min="50" step="10" style="width:60px;">
    </label>
  </div>

  <ul id="thumbnailsContainer" style="margin-top: 10px; display: flex; flex-wrap: wrap; gap: 5px;">

    <li
      v-for="(eachScreenshot, index) in screenshots"
      class="thumbnail"
      :class="{ 'thumbnail--drag-over': dragOverIndex === index }"
      :key="index"
      @dragover.prevent="dragOverIndex = index"
      @dragleave="onThumbnailDragLeave($event, index)"
      @drop.prevent="handleDropImageOnThumbnail($event, index)"
    >
      <img
        draggable="true"
        :src="eachScreenshot.toDataURL()"
        alt=""
        @dragstart="onScreenshotDragStart($event, index)"
      />
      <button
        @click="handleRemoveScreenshot(index)"
        class="delete-btn"
        type="button"
      ><span>🗑️</span></button>
    </li>
  </ul>
</div>
<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
<script src="gif.js"></script>
<script>
const { createApp, ref, onMounted, onUnmounted } = Vue;

let video;
let gif;
const WIDTH = Math.min(480, window.innerWidth);
let HEIGHT = 0; // will take ratio of webcam
let mainCanvasElt = null;
const thumbW = 160, thumbH = 120;
const workerScriptPath = new URL('gif.worker.js', window.location.href).toString();

let canvas
const updateHeightAccordingToWebCamRatio = () => {
  const tempCanvasToDetermineRatio = createCanvas(WIDTH, HEIGHT);
  tempCanvasToDetermineRatio.style.opacity = 0;
  tempCanvasToDetermineRatio.style.width = 0;
  tempCanvasToDetermineRatio.style.height = 0;  
  tempCanvasToDetermineRatio.parent('sketch-container');

  video = createCapture(VIDEO, () => {
    console.log('camera started');
  });
  video.size(WIDTH * 2, WIDTH * 2); // capture larger, but we draw it scaled to WIDTHxHEIGHT
  video.hide();

  video.elt.onloadedmetadata = () => {
    const aspectRatio = video.elt.videoHeight / video.elt.videoWidth;
    HEIGHT = WIDTH * aspectRatio;

    tempCanvasToDetermineRatio.remove();

    if (canvas) canvas.remove();
    canvas = createCanvas(WIDTH, HEIGHT);
    canvas.parent('sketch-container');
    mainCanvasElt = canvas.elt;
  };
};

const getFileName = () => {
  const now = new Date();

  const year = now.getFullYear();
  const month = String(now.getMonth() + 1).padStart(2, '0');
  const day = String(now.getDate()).padStart(2, '0');
  const hours = String(now.getHours()).padStart(2, '0');
  const minutes = String(now.getMinutes()).padStart(2, '0');
  const seconds = String(now.getSeconds()).padStart(2, '0');

  return `sds-gif-${year}-${month}-${day}-${hours}-${minutes}-${seconds}.gif`;
}

createApp({
  setup() {
    const screenshots = ref([]);
    const displayingPreview = ref(false);
    const previewImage = ref();
    const isCapturingBurst = ref(false);
    const burstCountdown = ref(0);

    const dummyFile = new File([''], 'dummy.gif', { type: 'image/gif' });
    const canShareFiles = navigator.canShare && navigator.canShare({ files: [dummyFile] });

    const browserCanShare = ref(canShareFiles);

    let previewBlob;
    function createGifFromScreenshots(action) {
      const delay = parseInt(document.getElementById('frameDelay').value, 10) || 200;

      gif = new GIF({
        workers: 2,
        quality: 10,
        width: WIDTH,
        height: HEIGHT,
        workerScript: workerScriptPath
      });

      screenshots.value.forEach(canvasFrame => {
        gif.addFrame(canvasFrame, { copy: true, delay: delay });
      });

      gif.on('finished', function(blob) {
        blob.name = getFileName();
        if (action === 'preview') {
          displayingPreview.value = true;
          previewBlob = blob;
          previewImage.value = URL.createObjectURL(blob);
        }
        if (action === 'download') {
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = blob.name;
          a.click();
        }
      });

      gif.on('progress', p => {
        console.log('GIF render progress', Math.round(p * 100) + '%');
      });

      gif.render();
    }

    const playCameraSound = () => {
      const audio = document.getElementById('cameraSound');
      if (audio) {
        audio.currentTime = 0; // Reset to beginning
        audio.play().catch(err => console.log('Audio play failed:', err));
      }
    };

    const handleTakeScreenshot = () => {
      const currentStateOfCanvas = document.createElement('canvas');
      currentStateOfCanvas.width = WIDTH;
      currentStateOfCanvas.height = HEIGHT;
      const fctx = currentStateOfCanvas.getContext('2d');
      fctx.drawImage(mainCanvasElt, 0, 0, WIDTH, HEIGHT);

      screenshots.value = [...screenshots.value, currentStateOfCanvas];
      playCameraSound();
    };

    const handleTakeBurst = async () => {
      if (isCapturingBurst.value) return;
      
      isCapturingBurst.value = true;
      
      // 3 second countdown
      burstCountdown.value = 3;
      for (let i = 3; i > 0; i--) {
        burstCountdown.value = i;
        await new Promise(resolve => setTimeout(resolve, 1000));
      }
      
        const delayBetweenPhotosInBurst = 1500;
      // Take 5 photos, 1 second apart
      for (let i = 0; i < 5; i++) {
        burstCountdown.value = 0; // Show "Capturing..." during photos
        handleTakeScreenshot();
        if (i < 4) { // Don't wait after the last photo
          await new Promise(resolve => setTimeout(resolve, delayBetweenPhotosInBurst));
        }
      }
      
      isCapturingBurst.value = false;
      burstCountdown.value = 0;
    };

    const handleRemoveScreenshot = (index) => {
      screenshots.value = screenshots.value.filter((_, i) => i !== index);
    };

    /** Browsers default data-URL drags to "download.png"; DownloadURL sets the desktop filename (Chrome, Edge, Safari). */
    const onScreenshotDragStart = (event, index) => {
      const canvas = screenshots.value[index];
      if (!canvas) return;
      const name = `sds-gif-frame-${String(index + 1).padStart(2, '0')}.png`;
      const dataUrl = canvas.toDataURL('image/png');
      try {
        event.dataTransfer.setData('DownloadURL', `image/png:${name}:${dataUrl}`);
      } catch (_) {
        /* Firefox may reject; drag still works with default name */
      }
      event.dataTransfer.effectAllowed = 'copy';
    };

    const dragOverIndex = ref(null);

    const ACCEPTED_IMAGE_EXT = new Set(['.jpg', '.jpeg', '.png', '.gif', '.webp']);
    const ACCEPTED_IMAGE_MIME = /^image\/(jpeg|png|gif|webp)$/i;

    function isAcceptedImageFile(file) {
      if (!file || !file.name) return false;
      if (ACCEPTED_IMAGE_MIME.test(file.type)) return true;
      const lower = file.name.toLowerCase();
      const dot = lower.lastIndexOf('.');
      if (dot === -1) return false;
      return ACCEPTED_IMAGE_EXT.has(lower.slice(dot));
    }

    function drawImageContainOnCanvas(img, targetW, targetH) {
      const out = document.createElement('canvas');
      out.width = targetW;
      out.height = targetH;
      const ctx = out.getContext('2d');
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, targetW, targetH);
      const nw = img.naturalWidth;
      const nh = img.naturalHeight;
      if (!nw || !nh) return out;
      const scale = Math.min(targetW / nw, targetH / nh);
      const dw = nw * scale;
      const dh = nh * scale;
      const dx = (targetW - dw) / 2;
      const dy = (targetH - dh) / 2;
      ctx.drawImage(img, dx, dy, dw, dh);
      return out;
    }

    const onThumbnailDragLeave = (event, index) => {
      const li = event.currentTarget;
      if (!li.contains(event.relatedTarget)) {
        if (dragOverIndex.value === index) dragOverIndex.value = null;
      }
    };

    const handleDropImageOnThumbnail = (event, index) => {
      dragOverIndex.value = null;
      const files = event.dataTransfer?.files;
      if (!files || !files.length) return;
      let file = null;
      for (let i = 0; i < files.length; i++) {
        if (isAcceptedImageFile(files[i])) {
          file = files[i];
          break;
        }
      }
      if (!file) return;

      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        URL.revokeObjectURL(url);
        if (!WIDTH || !HEIGHT) {
          console.warn('Frame size not ready; cannot replace screenshot.');
          return;
        }
        const frame = drawImageContainOnCanvas(img, WIDTH, HEIGHT);
        const next = [...screenshots.value];
        next[index] = frame;
        screenshots.value = next;
      };
      img.onerror = () => {
        URL.revokeObjectURL(url);
        console.warn('Could not load dropped image:', file.name);
      };
      img.src = url;
    };

    onMounted(() => {
      window.addEventListener('resize', updateHeightAccordingToWebCamRatio);
    });

    onUnmounted(() => {
      window.removeEventListener('resize', updateHeightAccordingToWebCamRatio);
    });

    const shareGif = () => {
      const fileToShare = new File([previewBlob], getFileName(), { type: 'image/gif' });

      navigator.share({
        title: 'My GIF',
        text: 'Created with SDS Gif Maker',
        files: [fileToShare]
      })
        .catch((err) => {
          console.error(err);
        });
    };

    return {
      displayingPreview,
      previewImage,
      browserCanShare,
      screenshots,
      isCapturingBurst,
      burstCountdown,
      shareGif,
      createGifFromScreenshots,
      handleTakeScreenshot,
      handleTakeBurst,
      handleRemoveScreenshot,
      onScreenshotDragStart,
      dragOverIndex,
      onThumbnailDragLeave,
      handleDropImageOnThumbnail,
    };
  },
})
  .mount('#app-container');

// p5
function setup() {
  pixelDensity(1);
  updateHeightAccordingToWebCamRatio();
}
function draw() {
  background(0);
  if (video) image(video, 0, 0, WIDTH, HEIGHT);
}

window.addEventListener('beforeunload', () => {
  if (video && video.elt && video.elt.srcObject)
    video.elt.srcObject.getTracks().forEach(track => track.stop());
  mainCanvasElt.remove();
  if (gif && gif.abort) gif.abort();
});
</script>
</body>
</html>
