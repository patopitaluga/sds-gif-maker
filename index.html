<!DOCTYPE html>
<html lang="es-es">
<head>
  <meta charset="utf-8" />
  <title>SDS Gif Maker</title>
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, viewport-fit=cover">
  <link rel="stylesheet" href="style.css">
  <style>
    /* tiny styles to keep things readable */
    #sketch-container { position: relative; display: inline-block; }
    .overlay-controls { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.5); padding: 5px; border-radius: 4px; }
    #thumbnails canvas { cursor: pointer; border: 1px solid #333; }
    .controls { margin-top: 8px; }
  </style>
</head>
<body>
<div class="title">SDS Gif Maker v10</div>

<div id="sketch-container">
  <div class="overlay-controls">
    <button id="takeScreenshot">📸 Take Screenshot</button>
  </div>
</div>

<div class="controls">
  <button id="createGif">🎞️ Create GIF</button>
  <label style="margin-left:10px;">
    Frame Delay (ms):
    <input id="frameDelay" type="number" value="200" min="50" step="10" style="width:60px;">
  </label>
</div>


<div id="thumbnailsContainer" style="margin-top: 10px; display: flex; flex-wrap: wrap; gap: 5px;"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
<script src="gif.js"></script>
<script>
let video;
let gif;
const screenshots = []; // will store HTMLCanvasElement frames
const WIDTH = 320;
const HEIGHT = 240;
let mainCanvasElt = null;
const thumbW = 160, thumbH = 120;
const workerScriptPath = new URL('gif.worker.js', window.location.href).toString();

function setup() {
  console.log('p5 setup running');
  const canvas = createCanvas(WIDTH, HEIGHT);
  canvas.parent('sketch-container');
  pixelDensity(1);
  mainCanvasElt = canvas.elt;

  video = createCapture(VIDEO, () => {
    console.log('camera started');
  });
  video.size(640, 480); // capture larger, but we draw it scaled to WIDTHxHEIGHT
  video.hide();

  document.getElementById('takeScreenshot').addEventListener('click', takeScreenshot);
  document.getElementById('createGif').addEventListener('click', createGifFromScreenshots);
}

function draw() {
  background(0);
  if (video) image(video, 0, 0, WIDTH, HEIGHT);
}

function addScreenshotThumbnail(canvas) {
  const container = document.createElement('div');
  container.className = 'thumbnail';

  const img = document.createElement('img');
  img.src = canvas.toDataURL();
  
  const deleteBtn = document.createElement('button');
  deleteBtn.className = 'delete-btn';
  deleteBtn.textContent = '🗑️';
  
  deleteBtn.addEventListener('click', () => {
    const index = screenshots.indexOf(canvas);
    if (index > -1) {
      screenshots.splice(index, 1);
    }
    container.remove();
  });

  container.appendChild(img);
  container.appendChild(deleteBtn);
  
  document.getElementById('thumbnailsContainer').appendChild(container);
}


function takeScreenshot() {
  // copy main canvas (what user sees) into a new canvas
  const full = document.createElement('canvas');
  full.width = WIDTH;
  full.height = HEIGHT;
  const fctx = full.getContext('2d');
  fctx.drawImage(mainCanvasElt, 0, 0, WIDTH, HEIGHT);

  // store the full-size canvas for GIF creation
  screenshots.push(full);

  // create thumbnail
  const thumb = document.createElement('canvas');
  thumb.width = thumbW;
  thumb.height = thumbH;
  const tctx = thumb.getContext('2d');
  tctx.drawImage(full, 0, 0, thumbW, thumbH);

  // clicking thumbnail removes it from DOM and from screenshots array
  thumb.addEventListener('click', () => {
    const idx = screenshots.indexOf(full);
    if (idx > -1) screenshots.splice(idx, 1);
    thumb.remove();
  });

  addScreenshotThumbnail(full);
}

function createGifFromScreenshots() {
  if (screenshots.length === 0) {
    alert('No screenshots to make a GIF!');
    return;
  }

  const delay = parseInt(document.getElementById('frameDelay').value, 10) || 200;

  gif = new GIF({
    workers: 2,
    quality: 10,
    width: WIDTH,
    height: HEIGHT,
    workerScript: workerScriptPath
  });

  screenshots.forEach(canvasFrame => {
    gif.addFrame(canvasFrame, { copy: true, delay: delay });
  });

  gif.on('finished', function(blob) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `sds-gifmaker-${Date.now()}.gif`;
    a.click();
  });

  gif.on('progress', p => {
    console.log('GIF render progress', Math.round(p * 100) + '%');
  });

  gif.render();
}
</script>
</body>
</html>
